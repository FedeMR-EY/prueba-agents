spring:
  application:
    name: anime-search-api-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

# OpenFeign clients configuration
clients:
  jikan:
    url: https://api.jikan.moe/v4

# Logging
logging:
  level:
    com.ey.app: WARN
